name: ANS Android APK
on:
  push:
    branches:
      - ans-earpiece-build
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source bundle
        uses: actions/checkout@v4
      - name: Unpack ANS UI app
        run: |
          base64 -d ans-source.zip.b64 > source.zip
          unzip -o -q source.zip
      - name: Prepare Android JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          printf 'y\n' | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ANS-earpiece-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
